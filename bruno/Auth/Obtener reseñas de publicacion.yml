info:
  name: Obtener reseñas de publicacion
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE_URL}}/usuarios/publicaciones/{{publicacionID}}/reseñas"
  auth: inherit

runtime:
  variables:
    - name: publicacionID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
