info:
  name: Obtener favoritos de publicacion
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE_URL}}/admin/favoritos/{{publicacionID}}"
  auth: inherit

runtime:
  variables:
    - name: publicacionID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
