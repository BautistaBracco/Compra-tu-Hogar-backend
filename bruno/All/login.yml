info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": {{comprador}},
        "password": "12345678"
      }
  auth: inherit

runtime:
  variables:
    - name: admin
      value: '"juan@gmail.com"'
    - name: comprador
      value: '"nestor@gmail.com"'
    - name: inmobiliaria
      value: '"InmobiliariaAlfonso@gmail.com"'
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (data.token) {
          bru.setVar("my_token", data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
