name: Backend CI Checks

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  test-and-build:
    name: Run Unit, Integration & BDD Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup de JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Permisos para Gradle Wrapper
        run: chmod +x ./gradlew

      # Tests Unitarios
      - name: Ejecutar Tests Unitarios
        run: ./gradlew test

      # Tests de Integración
      - name: Ejecutar Tests de Integración
        run: ./gradlew integration

      # Tests BDD
      - name: Ejecutar Tests BDD
        run: ./gradlew bdd


      # SonarCloud Analysis
      - name: Ejecutar SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true