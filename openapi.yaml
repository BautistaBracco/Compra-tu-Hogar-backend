openapi: 3.0.3
info:
  title: Compra Tu Hogar – API
  description: |
    API REST para el sistema **Compra Tu Hogar (CTH)**, desarrollado como proyecto académico.
    Esta API centraliza la gestión de propiedades, usuarios y operaciones comerciales.

    ### 👥 Roles de Usuario
    - `COMPRADOR`: Consulta publicaciones, gestiona favoritos, publica reseñas y realiza compras.
    - `INMOBILIARIA`: Realiza el ABM (Alta, Baja, Modificación) de sus propias publicaciones, consulta sus ventas y gestiona clientes.
    - `ADMINISTRADOR`: Gestión global, creación de inmobiliarias, mantenimiento del catálogo de características y generación de reportes estadísticos.

    ### 🔐 Autenticación
    Toda la comunicación segura se realiza mediante **JSON Web Tokens (JWT)**.
    - Para acceder a endpoints protegidos, el cliente debe enviar el token en la cabecera: 
      `Authorization: Bearer <token>`
    - El login y el registro público se gestionan desde el controlador `/auth`.

    ### 🏗️ Estructura de la API
    Los endpoints están agrupados por controladores, reflejando las responsabilidades de cada rol y funcionalidad del sistema.
  version: 2.1.0

servers:
  - url: http://localhost:8080
    description: Desarrollo local
  - url: https://api.compraturhogar.com
    description: Producción

tags:
  - name: Auth
    description: Registro público e inicio de sesión
  - name: Usuarios
    description: Operaciones disponibles para cualquier usuario autenticado
  - name: Comprador
    description: Exclusivo rol COMPRADOR
  - name: Inmobiliaria
    description: Exclusivo rol INMOBILIARIA
  - name: Admin
    description: Exclusivo rol ADMINISTRADOR
  - name: Health
    description: Estado del servicio

paths:
  # ──────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────
  /auth/register:
    post:
      tags: [ Auth ]
      summary: Registrar nuevo usuario (rol COMPRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUsuarioRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [ Auth ]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # ──────────────────────────────────────────
  # USUARIOS
  # ──────────────────────────────────────────
  /usuarios/imagen:
    post:
      tags: [ Usuarios ]
      summary: Subir imagen
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: URL de la imagen
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string } } }

  /usuarios/perfil:
    patch:
      tags: [ Usuarios ]
      summary: Actualizar perfil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsuarioRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'

  /usuarios/propiedad/{direccion}:
    get:
      tags: [ Usuarios ]
      summary: Buscar propiedad por dirección
      security: [{ bearerAuth: [] }]
      parameters:
        - name: direccion
          in: path
          required: true
          schema: { type: string }
        - name: piso
          in: query
          schema: { type: string }
        - name: depto
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Propiedad encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropiedadResponse'

  /usuarios/caracteristicas:
    get:
      tags: [ Usuarios ]
      summary: Listar todas las características
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de características
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaracteristicaResponse'

  /usuarios/publicacion/{id}:
    get:
      tags: [ Usuarios ]
      summary: Obtener publicación por ID
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Detalle de la publicación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionResponse'

  /usuarios/publicaciones:
    get:
      tags: [ Usuarios ]
      summary: Buscar publicaciones con filtros
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendida
          in: query
          schema: { type: boolean }
        - name: tipo
          in: query
          schema: { $ref: '#/components/schemas/TipoPropiedad' }
        - name: minPrecio
          in: query
          schema: { type: number, format: double }
        - name: maxPrecio
          in: query
          schema: { type: number, format: double }
        - name: ubicacion
          in: query
          schema: { type: string }
        - name: ambientesMin
          in: query
          schema: { type: integer }
        - name: ambientesMax
          in: query
          schema: { type: integer }
        - name: inmobiliariaId
          in: query
          schema: { type: integer, format: int64 }
        - name: caracteristicaIds
          in: query
          schema: { type: array, items: { type: integer, format: int64 } }
      responses:
        '200':
          description: Publicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicacionResponse'

  /usuarios/publicaciones/{id}/reseñas:
    get:
      tags: [ Usuarios ]
      summary: Listar reseñas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Reseñas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResenaResponse'

  # ──────────────────────────────────────────
  # COMPRADOR
  # ──────────────────────────────────────────
  /comprador/favoritos:
    get:
      tags: [ Comprador ]
      summary: Listar favoritos
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Favoritos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicacionResponse'

  /comprador/favoritos/{publicacionId}:
    post:
      tags: [ Comprador ]
      summary: Agregar favorito
      security: [{ bearerAuth: [] }]
      parameters:
        - name: publicacionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Publicación agregada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionResponse'
    delete:
      tags: [ Comprador ]
      summary: Quitar favorito
      security: [{ bearerAuth: [] }]
      parameters:
        - name: publicacionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Favorito eliminado

  /comprador/reseñas/{publicacionId}:
    post:
      tags: [ Comprador ]
      summary: Agregar reseña
      security: [{ bearerAuth: [] }]
      parameters:
        - name: publicacionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResenaRequest'
      responses:
        '200':
          description: Reseña creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaResponse'

  /comprador/reseñas/{resenaId}:
    delete:
      tags: [ Comprador ]
      summary: Eliminar reseña
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resenaId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Reseña eliminada

  /comprador/comprar/{publicacionId}:
    post:
      tags: [ Comprador ]
      summary: Comprar propiedad
      security: [{ bearerAuth: [] }]
      parameters:
        - name: publicacionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Compra registrada

  /comprador/compras:
    get:
      tags: [ Comprador ]
      summary: Historial de compras
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de compras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompraResponse'

  # ──────────────────────────────────────────
  # INMOBILIARIA
  # ──────────────────────────────────────────
  /inmobiliaria/publicacion:
    post:
      tags: [ Inmobiliaria ]
      summary: Crear publicación
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicacionRequest'
      responses:
        '201':
          description: Publicación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionResponse'
    get:
      tags: [ Inmobiliaria ]
      summary: Listar publicaciones propias
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Publicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicacionResponse'

  /inmobiliaria/publicacion/{id}:
    put:
      tags: [ Inmobiliaria ]
      summary: Modificar publicación propia
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicacionRequest'
      responses:
        '200':
          description: Publicación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionResponse'
    delete:
      tags: [ Inmobiliaria ]
      summary: Eliminar publicación propia
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Publicación eliminada

  /inmobiliaria/ventas:
    get:
      tags: [ Inmobiliaria ]
      summary: Listar ventas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ventas realizadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompraResponse'

  /inmobiliaria/clientes:
    get:
      tags: [ Inmobiliaria ]
      summary: Listar clientes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResponse'

  # ──────────────────────────────────────────
  # ADMIN
  # ──────────────────────────────────────────
  /admin/usuarios:
    get:
      tags: [ Admin ]
      summary: Listar usuarios por rol
      security: [{ bearerAuth: [] }]
      parameters:
        - name: rol
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RolUsuario' }
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResponse'

  /admin/inmobiliaria:
    post:
      tags: [ Admin ]
      summary: Registrar nueva inmobiliaria
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUsuarioRequest'
      responses:
        '201':
          description: Inmobiliaria creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /admin/caracteristicas:
    post:
      tags: [ Admin ]
      summary: Crear característica
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaracteristicaRequest'
      responses:
        '201':
          description: Característica creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaracteristicaResponse'

  /admin/reseñas/{usuarioId}:
    get:
      tags: [ Admin ]
      summary: Listar reseñas de usuario
      security: [{ bearerAuth: [] }]
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Reseñas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResenaResponse'

  /admin/favoritos:
    get:
      tags: [ Admin ]
      summary: Listar publicaciones con favoritos
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Publicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicacionResponse'

  /admin/favoritos/{publicacionId}:
    get:
      tags: [ Admin ]
      summary: Listar usuarios de favoritos
      security: [{ bearerAuth: [] }]
      parameters:
        - name: publicacionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResponse'

  /admin/compras:
    get:
      tags: [ Admin ]
      summary: Listar todas las compras
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Compras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompraResponse'

  /admin/top-usuarios:
    get:
      tags: [ Admin ]
      summary: Top usuarios
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopUserResponse'

  /admin/top-publicaciones:
    get:
      tags: [ Admin ]
      summary: Top publicaciones
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopPropertyResponse'

  /admin/top-inmobiliarias:
    get:
      tags: [ Admin ]
      summary: Top inmobiliarias
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopAgencyResponse'

  # ──────────────────────────────────────────
  # HEALTH
  # ──────────────────────────────────────────
  /health:
    get:
      tags: [ Health ]
      summary: Estado del servicio
      responses:
        '200':
          description: Servicio OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TipoPropiedad:
      type: string
      enum: [ CASA, DEPARTAMENTO ]

    RolUsuario:
      type: string
      enum: [ COMPRADOR, INMOBILIARIA, ADMINISTRADOR ]

    CreateUsuarioRequest:
      type: object
      required: [ nombre, email, password ]
      properties:
        nombre: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        icono: { type: string }

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    UpdateUsuarioRequest:
      type: object
      properties:
        nombre: { type: string }
        icono: { type: string }

    CreateCaracteristicaRequest:
      type: object
      required: [ nombre ]
      properties:
        nombre: { type: string }

    CreatePropiedadRequest:
      type: object
      required: [ tipo, ubicacion ]
      properties:
        tipo: { $ref: '#/components/schemas/TipoPropiedad' }
        ubicacion: { type: string }
        piso: { type: string, nullable: true }
        depto: { type: string, nullable: true }
        superficie: { type: integer }
        ambientes: { type: integer }
        sanitarios: { type: integer }
        expensas: { type: integer }
        caracteristicaIds: { type: array, items: { type: integer, format: int64 } }

    CreatePublicacionRequest:
      type: object
      required: [ propiedad ]
      properties:
        descripcion: { type: string }
        precio: { type: number, format: double }
        imagenes: { type: array, items: { type: string } }
        propiedad: { $ref: '#/components/schemas/CreatePropiedadRequest' }

    UpdatePublicacionRequest:
      type: object
      required: [ descripcion, precio ]
      properties:
        descripcion: { type: string }
        precio: { type: number, format: double }
        imagenes: { type: array, items: { type: string } }

    CreateResenaRequest:
      type: object
      required: [ puntaje ]
      properties:
        puntaje: { type: integer }
        comentario: { type: string }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        id: { type: integer, format: int64 }
        nombre: { type: string }
        email: { type: string }
        icono: { type: string }
        rol: { type: string }

    UsuarioResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        email: { type: string }
        icono: { type: string }

    UsuarioMetadataResponse:
      type: object
      properties:
        esFavorito: { type: boolean }

    CaracteristicaResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }

    PropiedadResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        ubicacion: { type: string }
        piso: { type: string }
        depto: { type: string }
        tipo: { $ref: '#/components/schemas/TipoPropiedad' }
        superficie: { type: integer }
        ambientes: { type: integer }
        sanitarios: { type: integer }
        expensas: { type: integer }
        vendida: { type: boolean }
        caracteristicas: { type: array, items: { type: string } }

    PublicacionResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        descripcion: { type: string }
        precio: { type: number, format: double }
        imagenes: { type: array, items: { type: string } }
        inmobiliaria: { $ref: '#/components/schemas/UsuarioResponse' }
        propiedad: { $ref: '#/components/schemas/PropiedadResponse' }
        metadata: { $ref: '#/components/schemas/UsuarioMetadataResponse' }

    ResenaResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        puntaje: { type: integer }
        comentario: { type: string }
        autorId: { type: integer, format: int64 }
        autorNombre: { type: string }
        publicacionId: { type: integer, format: int64 }

    CompraResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        precioFinal: { type: number, format: double }
        fechaCompra: { type: string, format: date-time }
        comprador: { $ref: '#/components/schemas/UsuarioResponse' }
        publicacion: { $ref: '#/components/schemas/PublicacionResponse' }

    TopUserResponse:
      type: object
      properties:
        usuario: { $ref: '#/components/schemas/UsuarioResponse' }
        comprasCount: { type: integer, format: int64 }

    TopPropertyResponse:
      type: object
      properties:
        propiedad: { $ref: '#/components/schemas/PropiedadResponse' }
        averageRating: { type: number, format: double }

    TopAgencyResponse:
      type: object
      properties:
        inmobiliaria: { $ref: '#/components/schemas/UsuarioResponse' }
        ventasCount: { type: integer, format: int64 }

    HealthStatusResponse:
      type: object
      properties:
        status: { type: string }
        database: { type: string }
        error: { type: string }

    ApiError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        details: { type: object }
